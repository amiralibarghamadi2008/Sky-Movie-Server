
version: '3.8'

services:
  # 🍃 سرویس دیتابیس مونگو
  mongo:
    image: mongo:latest
    container_name: mavara_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
      MONGO_INITDB_DATABASE: MavaraSystem
    volumes:
      - mongo_data:/data/db

  # 🚀 سرویس بک‌اند اکسپرس
  backend:
    build: .
    container_name: mavara_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - mongo

volumes:
  mongo_data:
